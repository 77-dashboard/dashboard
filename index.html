<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>方舟運算 ｜ 產業價值區</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b101b] text-gray-200 min-h-screen p-6 font-sans">
  <div class="max-w-6xl mx-auto space-y-6">

    <!-- 頂部資訊列 -->
    <header class="flex justify-between items-center border-b border-gray-800 pb-4">
      <div class="flex items-center space-x-3">
        <span class="px-2 py-0.5 bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded text-xs font-bold">ARK</span>
        <h1 class="text-base font-semibold">方舟運算 · 產業價值區</h1>
      </div>
      <div class="text-xs text-gray-500">
        最後更新：<span id="update-time" class="text-gray-400">2026-10-13 15:30:30</span>
      </div>
    </header>

    <!-- 狀態備援橫幅 -->
    <div id="fallback-banner" class="bg-[#111827]/80 border border-gray-800 rounded-xl p-4 text-xs space-y-2">
      <div class="flex items-center gap-2">
        <span class="px-2 py-0.5 bg-amber-500/10 text-amber-400 border border-amber-500/30 rounded text-[11px] font-medium" id="status-badge">資料不足 · 沿用上一版</span>
        <span class="text-gray-400" id="fallback-note">原版為人工研究排序，未套用目前數值評分。</span>
      </div>
      <ul id="source-list" class="text-gray-500 space-y-1 pt-1 border-t border-gray-800/60">
        <li class="flex justify-between"><span>• 公開資訊觀測站重訊／群益轉載</span><span class="font-mono">2026-10-07</span></li>
        <li class="flex justify-between"><span>• 財訊快報／富聯網 9 月營收</span><span class="font-mono">2026-10-07</span></li>
        <li class="flex justify-between"><span>• 鉅亨／優分析：8 月營收與測試產業</span><span class="font-mono">2026-10-06</span></li>
      </ul>
    </div>

    <!-- 產業評分泡泡區 -->
    <section>
      <h2 class="text-xs font-semibold text-gray-400 tracking-wider mb-4">總經事件 · 資金流向與產業鏈環節</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- 記憶體 -->
        <div class="flex flex-col items-center justify-center p-6 bg-[#131b2b]/60 rounded-xl border border-gray-800">
          <div class="w-24 h-24 rounded-full border-2 border-slate-700 bg-slate-900/60 flex flex-col items-center justify-center shadow-lg mb-2">
            <span class="text-xs text-gray-400">記憶體</span>
            <span class="text-xl font-bold text-gray-200">0.8</span>
          </div>
          <p class="text-xs text-gray-500">產業鏈觀察 · 待確認</p>
        </div>

        <!-- 晶圓代工 -->
        <div class="flex flex-col items-center justify-center p-6 bg-[#131b2b]/60 rounded-xl border border-gray-800">
          <div class="w-24 h-24 rounded-full border-2 border-slate-700 bg-slate-900/60 flex flex-col items-center justify-center shadow-lg mb-2">
            <span class="text-xs text-gray-400">晶圓代工</span>
            <span class="text-xl font-bold text-gray-200">0.8</span>
          </div>
          <p class
