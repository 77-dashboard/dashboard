name: Daily Stock Analysis Update

on:
  schedule:
    # 每天週一至週五 台灣時間 09:40 自動執行 (UTC 時間為 01:40)
    - cron: '40 1 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點「Run workflow」隨時觸發

permissions:
  contents: write # 確保機器人擁有將 data.json 推送回倉庫的寫入權限

jobs:
  run-update:
    runs-on: ubuntu-latest
    steps:
      - name: 下載專案代碼
        uses: actions/checkout@v3

      - name: 安裝 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝相依套件
        run: pip install requests

      - name: 執行更新腳本
        run: python update.py

      - name: 自動提交並推送變更
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "自動更新數據: $(date +'%Y-%m-%d %H:%M')" || echo "資料無變動"
          git push
